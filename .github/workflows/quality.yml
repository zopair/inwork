name: InWork Continuous Quality

on:
  pull_request:
  push:
    branches:
      - service-marketplace-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    name: Web E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/inwork.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/inwork.js
      - name: Run browser tests
        run: npx playwright test --config=playwright.ci.config.js

  backend:
    name: Backend Security and Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run all backend tests
        working-directory: backend
        run: python -m unittest discover -v

  container:
    name: Portable Docker and Compose Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build portable InWork image
        run: docker build -f backend/Dockerfile -t inwork-ci .
      - name: Validate Compose configuration
        run: INWORK_ADMIN_BOOTSTRAP_TOKEN=ci-only-not-a-secret docker compose config --quiet
