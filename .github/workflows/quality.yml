name: InWork Continuous Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No inline application JavaScript found')
          Path('/tmp/inwork.js').write_text('\\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/inwork.js
      - name: Run browser tests
        run: npx playwright test --config=playwright.ci.config.js

  backend:
    name: Backend Security and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run all backend tests
        working-directory: backend
        run: python -m unittest discover -v
