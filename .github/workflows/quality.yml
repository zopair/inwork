name: InWork Continuous Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Open-source test stack:
# - Microsoft Playwright for browser E2E tests
# - Google's Android emulator container project is the reference model for
#   emulator-based CI; the GitHub-hosted Android emulator action provides the
#   practical runner integration on the hosted Linux VM.

jobs:
  web-e2e:
    name: Web E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          if-no-files-found: ignore

  android-emulator:
    name: Android Emulator Smoke Test
    needs: web-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare bundled web assets
        shell: bash
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/web
          cp index.html android/app/src/main/assets/web/index.html
          cp manifest.webmanifest android/app/src/main/assets/web/manifest.webmanifest
          cp sw.js android/app/src/main/assets/web/sw.js

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Start Android emulator and test APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.inwork.app || true
            adb shell monkey -p com.inwork.app 1
            sleep 8
            adb shell uiautomator dump /sdcard/inwork-window.xml
            adb pull /sdcard/inwork-window.xml inwork-window.xml
            grep -E 'InWork|فرص|شغل|ابدأ' inwork-window.xml
            adb exec-out screencap -p > inwork-emulator.png
            adb logcat -d > inwork-logcat.txt

      - name: Upload Android smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence
          path: |
            inwork-emulator.png
            inwork-window.xml
            inwork-logcat.txt
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: warn

  apk-release-candidate:
    name: APK Release Candidate
    needs: android-emulator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bundle web assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/web
          cp index.html android/app/src/main/assets/web/index.html
          cp manifest.webmanifest android/app/src/main/assets/web/manifest.webmanifest
          cp sw.js android/app/src/main/assets/web/sw.js
      - name: Build release candidate APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: InWork-verified-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
