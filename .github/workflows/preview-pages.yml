name: Deploy InWork isolated test preview
on:
  push:
    branches:
      - service-marketplace-v1
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: inwork-pages
  cancel-in-progress: true
jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current published site
        uses: actions/checkout@v6
        with:
          ref: main
          path: current
      - name: Checkout marketplace candidate
        uses: actions/checkout@v6
        with:
          ref: service-marketplace-v1
          path: candidate
      - uses: actions/configure-pages@v5
      - name: Assemble production root and isolated preview
        run: |
          mkdir -p site/preview
          cp current/mobile/index.html site/index.html
          cp current/manifest.webmanifest site/manifest.webmanifest
          cp current/sw.js site/sw.js
          cp candidate/index.html site/preview/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
