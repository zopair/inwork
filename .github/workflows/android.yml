name: InWork Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate main application JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if not scripts:
            raise SystemExit('No JavaScript found in index.html')
          Path('/tmp/inwork.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('Extracted JS:', len(scripts), 'script blocks')
          PY
          node --check /tmp/inwork.js
  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare web assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/web
          cp index.html android/app/src/main/assets/web/index.html
          cp manifest.webmanifest android/app/src/main/assets/web/manifest.webmanifest
          cp sw.js android/app/src/main/assets/web/sw.js
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InWork-fixed-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
