<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>InWork — فرص شغل تناسبك</title><style>:root{--p:#4f46e5;--p2:#6d28d9;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:#0f172a;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;min-height:100vh;margin:auto;background:var(--bg)}.screen{min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:5;background:#ffffffee;backdrop-filter:blur(14px);border-bottom:1px solid #eef2f7;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;color:var(--p)}.back{border:0;background:none;font-size:27px;color:#64748b}.pad{padding:20px}.hero{min-height:100vh;padding:24px;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff,#f5f3ff)}.spacer{flex:1}.logo{width:84px;height:84px;border-radius:27px;background:linear-gradient(135deg,#6366f1,#7c3aed);display:grid;place-items:center;color:#fff;font-size:40px;box-shadow:0 20px 50px #4f46e53b;margin-bottom:20px}.h1{font-size:43px;line-height:1.05;margin:0;font-weight:950}.lead{font-size:20px;line-height:1.8;color:var(--muted);font-weight:750}.btn{width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:900;font-size:16px;background:var(--p);color:#fff;box-shadow:0 10px 22px #4f46e53a}.btn.secondary{background:#fff;color:#475569;border:2px solid var(--line);box-shadow:none}.btn:disabled{background:#e2e8f0;color:#94a3b8;box-shadow:none}.field{margin:15px 0}.label{font-weight:850;font-size:14px;display:block;margin-bottom:7px}.inp{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;background:#fff}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:2px solid var(--line);background:#fff;color:#64748b;border-radius:12px;padding:9px 12px;font-weight:800}.chip.on{border-color:var(--p);background:#eef2ff;color:var(--p2)}.box{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px}.notice{padding:12px 14px;border-radius:14px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-weight:750;font-size:12px;line-height:1.7}.section{margin:18px 0}.section h3{margin:0 0 5px;font-size:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 5px 18px #0f172a08}.cardhead{display:flex;justify-content:space-between;gap:10px}.tag{font-size:11px;font-weight:900;padding:5px 9px;border-radius:999px}.high{background:#d1fae5;color:#047857}.mid{background:#e0e7ff;color:#4338ca}.low{background:#fef3c7;color:#92400e}.meta{font-size:12px;color:#64748b;font-weight:700;line-height:1.8}.money{font-size:15px;font-weight:950}.small{font-size:11px;color:#94a3b8;font-weight:700}.modal{position:fixed;inset:0;background:#0f172a66;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(560px,100%);background:#fff;border-radius:24px 24px 0 0;padding:22px;max-height:90vh;overflow:auto}.bottom{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:7px}.nav{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 5px;font-size:11px;font-weight:900;color:#64748b}.nav.on{background:#eef2ff;color:var(--p2)}.map{width:100%;height:330px;border:0;border-radius:18px;background:#e2e8f0}.mapwrap{position:relative}.mapnote{position:absolute;z-index:2;right:10px;top:10px;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 4px 15px #0002;font-size:11px;font-weight:850}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{font-size:20px}.footer{text-align:center;font-size:10px;color:#94a3b8;font-weight:800;padding:12px}</style></head><body><main id="app" class="app"></main><script>const GOVS=['القاهرة','الجيزة','الإسكندرية','الدقهلية','الشرقية','المنوفية','الغربية','كفر الشيخ','البحيرة','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','بورسعيد','السويس','الإسماعيلية','دمياط','الفيوم','بني سويف','مطروح','البحر الأحمر'];const FIELDS=['مبيعات','خدمة عملاء','تعليم','صحة','تقنية / كمبيوتر','تصميم','مطبخ وطعام','حرف يدوية','محاسبة','إدارة وتنظيم','مواصلات / توصيل','مصانع وورش'];const SKILLS=['كمبيوتر','Excel','Word','تنظيم','تواصل','خدمة عملاء','مبيعات','تسويق','كتابة','إدارة وقت','برمجة','Frontend','HTML','واجهات','تصميم','Canva','مونتاج','سوشيال ميديا','تصوير','طبخ','خياطة','تطريز','صيانة','قيادة','محاسبة','إدخال بيانات'];const JOBS=[{id:'1',title:'مساعد افتراضي',mode:'Remote · Freelance',gov:'الإسماعيلية',pay:'8,000–15,000 جنيه',skills:['تنظيم','تواصل','كمبيوتر','إدارة وقت'],interests:['إدارة وتنظيم','خدمة عملاء'],lat:30.5900,lon:32.2650,desc:'تنظيم مواعيد وملفات ومتابعة العملاء عن بعد.'},{id:'2',title:'مدخل بيانات',mode:'من البيت · جزئي',gov:'الإسماعيلية',pay:'6,000–10,000 جنيه',skills:['Excel','كتابة','إدخال بيانات','كمبيوتر'],interests:['إدارة وتنظيم'],lat:30.6040,lon:32.2850,desc:'إدخال ومراجعة البيانات في ملفات وجداول.'},{id:'3',title:'Customer Support',mode:'Remote · دوام كامل',gov:'الإسماعيلية',pay:'$500–900',skills:['تواصل','خدمة عملاء','كمبيوتر'],interests:['خدمة عملاء','مبيعات'],lat:30.5750,lon:32.3000,desc:'دعم العملاء عبر الدردشة والبريد.'},{id:'4',title:'مصمم سوشيال ميديا',mode:'Remote · Freelance',gov:'الإسماعيلية',pay:'6,000–15,000 جنيه',skills:['تصميم','Canva','سوشيال ميديا','تصوير'],interests:['تصميم'],lat:30.5880,lon:32.2500,desc:'تصميم محتوى بصري للصفحات والمتاجر.'},{id:'5',title:'مساعد محاسب',mode:'دوام جزئي',gov:'الإسماعيلية',pay:'9,000–16,000 جنيه',skills:['Excel','محاسبة','تنظيم'],interests:['محاسبة','إدارة وتنظيم'],lat:30.6100,lon:32.2700,desc:'مساعدة في الفواتير والمصروفات والتقارير.'},{id:'6',title:'خياطة وتطريز حسب الطلب',mode:'من البيت · مشروع',gov:'الإسماعيلية',pay:'حسب الطلب',skills:['خياطة','تطريز'],interests:['حرف يدوية'],lat:30.5800,lon:32.2750,desc:'تنفيذ منتجات منزلية حسب الطلب.'},{id:'7',title:'سائق توصيل',mode:'مشروع · محلي',gov:'الإسماعيلية',pay:'حسب عدد الطلبات',skills:['قيادة','تواصل'],interests:['مواصلات / توصيل'],lat:30.5950,lon:32.2900,desc:'توصيل طلبات داخل نطاق مناسب.'},{id:'8',title:'مساعد Frontend مبتدئ',mode:'Remote · مشروع',gov:'الإسماعيلية',pay:'$300–800 / مشروع',skills:['HTML','Frontend','برمجة','واجهات'],interests:['تقنية / كمبيوتر'],lat:30.6000,lon:32.2600,desc:'مهام Frontend بسيطة تحت إشراف فريق.'}];function base(){return{name:'',gov:'',age:'',contact:'',fields:[],skills:[],english:'متوسط',exp:0,prefs:[],interests:[],lat:null,lon:null}}let user=JSON.parse(localStorage.getItem('inwork_user_v2')||'null')||base();let state={screen:localStorage.getItem('inwork_user_v2')?'home':'welcome',step:0,detail:null,fav:JSON.parse(localStorage.getItem('inwork_favs')||'[]'),toast:''};function save(){localStorage.setItem('inwork_user_v2',JSON.stringify(user));localStorage.setItem('inwork_favs',JSON.stringify(state.fav))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function go(s){state.screen=s;state.detail=null;render()}function setU(k,v){user={...user,[k]:v};save();render()}function toggle(k,v){let a=user[k]||[];user={...user,[k]:a.includes(v)?a.filter(x=>x!==v):[...a,v]};save();render()}function chip(x,on,fn){return`<button class="chip ${on?'on':''}" onclick="${fn}">${esc(x)}</button>`}function top(back){return`<div class="top"><button class="back" onclick="go('${back||'home'}')">‹</button><div class="brand">◈ InWork</div><button class="back" onclick="go('profileScreen')">☻</button></div>`}function welcome(){return`<section class="screen hero"><div class="spacer"></div><div><div class="logo">◈</div><h1 class="h1">InWork</h1><p class="lead">فرص شغل ومشاريع<br>أقرب ليك وأقرب لطبيعتك.</p><button class="btn" onclick="go('legal')">يلا نبدأ</button><p class="small" style="text-align:center;margin-top:10px">بسيط · جذاب · فعّال — والقرار دايمًا ليك</p></div><div class="spacer"></div></section>`}function legal(){return`<section class="screen">${top('welcome')}<div class="pad"><h2>قبل ما نبدأ</h2><div class="box" style="line-height:1.9;font-size:13px"><b>اقتراحات وليست ضمانات</b><p>InWork تساعدك في اكتشاف الفرص. أي دخل أو فرصة معروضة ليست ضمانًا للتوظيف أو الأرباح.</p><b>بياناتك</b><p>في هذه النسخة التجريبية يتم حفظ ملفك على الهاتف فقط.</p><b>الخريطة</b><p>الخريطة تعتمد على OpenStreetMap المفتوحة.</p></div><label style="display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-weight:800;font-size:13px"><input id="agree" type="checkbox"> أوافق على الشروط وإخلاء المسؤولية</label><button class="btn" onclick="if(document.getElementById('agree').checked)go('register');else toast('وافق على الشروط أولًا')">موافق ونكمل</button></div></section>`}function register(){return`<section class="screen">${top('legal')}<div class="pad"><h2>خلّينا نتعرف عليك 👋</h2><p class="meta">بيانات قليلة عشان المطابقة تكون أذكى.</p><div class="field"><label class="label">الاسم</label><input class="inp" value="${esc(user.name)}" oninput="user.name=this.value;save()"></div><div class="field"><label class="label">المحافظة</label><select class="inp" onchange="user.gov=this.value;save();render()"><option value="">اختار</option>${GOVS.map(g=>`<option ${user.gov===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label class="label">العمر</label><input class="inp" type="number" min="15" max="80" value="${esc(user.age)}" oninput="user.age=this.value;save()"></div><div class="field"><label class="label">وسيلة تواصل اختيارية</label><input class="inp" value="${esc(user.contact)}" placeholder="موبايل أو بريد" oninput="user.contact=this.value;save()"></div><button class="btn" ${user.name&&user.gov&&user.age?'':'disabled'} onclick="state.step=0;go('profile')">التالي</button></div></section>`}function profile(){let b='';if(state.step===0)b=`<h2>مجالاتك</h2><p class="meta">اختار ما يناسبك الآن.</p><div class="chips" style="margin-top:15px">${FIELDS.map(x=>chip(x,user.fields.includes(x),`toggle('fields','${x}')`)).join('')}</div>`;if(state.step===1)b=`<h2>مهاراتك</h2><p class="meta">اختار المهارات التي تستطيع استخدامها فعليًا.</p><div class="chips" style="margin-top:15px">${SKILLS.map(x=>chip(x,user.skills.includes(x),`toggle('skills','${x}')`)).join('')}</div>`;if(state.step===2)b=`<h2>الخبرة والإنجليزية</h2><div class="section"><label class="label">مستوى الإنجليزية</label><div class="chips">${['محدود','متوسط','جيد','ممتاز'].map(x=>chip(x,user.english===x,`setU('english','${x}')`)).join('')}</div></div><div class="section"><label class="label">سنوات الخبرة</label><div class="chips">${['0','1','2','3','5','10'].map(x=>chip(x+' سنة',user.exp==x,`setU('exp',${x})`)).join('')}</div></div>`;if(state.step===3)b=`<h2>طريقة الشغل</h2><div class="chips" style="margin-top:15px">${['Remote','من البيت','Freelance','دوام كامل','دوام جزئي','مشروع'].map(x=>chip(x,user.prefs.includes(x),`toggle('prefs','${x}')`)).join('')}</div><div class="section"><label class="label">اهتماماتك</label><div class="chips">${FIELDS.map(x=>chip(x,user.interests.includes(x),`toggle('interests','${x}')`)).join('')}</div></div>`;return`<section class="screen">${top(state.step?'profile':'register')}<div class="pad">${b}<div style="display:flex;gap:8px;margin-top:25px"><button class="btn secondary" onclick="if(state.step){state.step--;render()}else go('register')">رجوع</button><button class="btn" onclick="if(state.step<3){state.step++;render()}else go('home')">${state.step<3?'التالي':'شوف الفرص'}</button></div><div class="small" style="text-align:center;margin-top:10px">${state.step+1} / 4</div></div></section>`}function score(j){let sk=new Set(user.skills),ins=new Set(user.interests.length?user.interests:user.fields),a=j.skills.filter(x=>sk.has(x)).length,b=j.interests.some(x=>ins.has(x)),lang=(j.title==='Customer Support'||j.title.includes('Frontend'))?(user.english!=='محدود'):true;return Math.min(99,a*28+(b?25:0)+(user.gov==='الإسماعيلية'&&j.gov==='الإسماعيلية'?20:0)+(lang?12:0)+(user.exp>=1?8:0))}function matches(){return JOBS.map(j=>({...j,score:score(j)})).filter(j=>j.score>=25).sort((a,b)=>b.score-a.score)}function jobCard(j){let fav=state.fav.includes(j.id);return`<button class="card" style="width:100%;text-align:right" onclick="state.detail='${j.id}';render()"><div class="cardhead"><div><b>${esc(j.title)}</b><div class="meta">${esc(j.mode)} · ${esc(j.gov)}</div></div><span class="tag ${j.score>=70?'high':j.score>=45?'mid':'low'}">${j.score}%</span></div><div class="money" style="margin-top:8px">${esc(j.pay)}</div><div class="small">${j.skills.slice(0,4).join(' · ')}</div><div style="text-align:left;margin-top:5px"><span onclick="event.stopPropagation();fav('${j.id}')" style="font-size:20px">${fav?'♥':'♡'}</span></div></button>`}function nav(a){return`<div class="bottom"><button class="nav ${a==='home'?'on':''}" onclick="go('home')">⌂<br>الرئيسية</button><button class="nav ${a==='map'?'on':''}" onclick="go('map')">⌖<br>الخريطة</button><button class="nav ${a==='saved'?'on':''}" onclick="go('saved')">♥<br>المحفوظة</button><button class="nav ${a==='profileScreen'?'on':''}" onclick="go('profileScreen')">☻<br>ملفي</button></div>`}function home(){let m=matches();return`<section class="screen">${top('welcome')}<div class="pad"><div class="box" style="background:linear-gradient(135deg,#eef2ff,#faf5ff);border:0"><b>أهلًا ${esc(user.name)} 👋</b><p class="meta">جهزنا لك ${m.length} فرصة بناءً على ملفك.</p><button class="btn" style="margin-top:10px" onclick="go('map')">📍 شوف الفرص على الخريطة</button></div><div class="section"><h3>🔥 أفضل المطابقات</h3>${m.slice(0,5).map(jobCard).join('')||`<div class="box">زود مهاراتك أو اهتماماتك عشان نلاقي فرص أكتر.</div>`}</div><div class="statgrid"><div class="stat"><b>${m.length}</b><div class="small">فرصة مقترحة</div></div><div class="stat"><b>${state.fav.length}</b><div class="small">محفوظة</div></div></div></div>${nav('home')}</section>`}function map(){let lat=user.lat||30.5900,lon=user.lon||32.2650,bbox=`${lon-0.045}%2C${lat-0.035}%2C${lon+0.045}%2C${lat+0.035}`;return`<section class="screen">${top('home')}<div class="pad"><h2>فرص قريبة منك 📍</h2><p class="meta">الخريطة مفتوحة المصدر. يمكنك تحديد موقعك من الهاتف.</p><div class="mapwrap"><div class="mapnote">OpenStreetMap</div><iframe class="map" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lon}"></iframe></div><button class="btn" style="margin-top:10px" onclick="locate()">📍 تحديد موقعي</button><div class="section">${matches().slice(0,6).map(jobCard).join('')}</div></div>${nav('map')}</section>`}function saved(){let a=JOBS.filter(j=>state.fav.includes(j.id)).map(j=>({...j,score:score(j)}));return`<section class="screen">${top('home')}<div class="pad"><h2>المحفوظة ♥</h2>${a.length?a.map(jobCard).join(''):`<div class="box">لسه مفيش فرص محفوظة.</div>`}</div>${nav('saved')}</section>`}function profileScreen(){return`<section class="screen">${top('home')}<div class="pad"><h2>ملفي</h2><div class="box"><b>${esc(user.name)}</b><div class="meta">${esc(user.gov)} · ${esc(user.age)} سنة</div><div class="small">${user.skills.length} مهارة · ${user.interests.length} اهتمام</div></div><div class="section"><button class="btn" onclick="state.step=0;go('profile')">تعديل بياناتي</button><button class="btn secondary" style="margin-top:8px" onclick="exportProfile()">تصدير بياناتي</button><button class="btn secondary" style="margin-top:8px" onclick="resetAll()">مسح البيانات</button></div><div class="notice">بيانات هذه النسخة محفوظة محليًا على الهاتف.</div></div>${nav('profileScreen')}</section>`}function detail(){let j=JOBS.find(x=>x.id===state.detail);if(!j)return'';return`<div class="modal" onclick="state.detail=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="tag high">مطابقة ${j.score}%</div><h2>${esc(j.title)}</h2><div class="money">${esc(j.pay)}</div><p class="meta">${esc(j.mode)} · ${esc(j.gov)}</p><p style="line-height:1.9;color:#475569">${esc(j.desc)}</p><div class="box"><b>ليه ظهرت لك؟</b><p class="meta">بناءً على مهاراتك واهتماماتك والخبرة والموقع. النتيجة توصية وليست ضمانًا.</p></div><div class="chips" style="margin-top:12px">${j.skills.map(x=>`<span class="chip on">${esc(x)}</span>`).join('')}</div><button class="btn" style="margin-top:15px" onclick="fav('${j.id}');state.detail=null;render()">${state.fav.includes(j.id)?'إزالة من المحفوظة':'حفظ الفرصة'}</button><button class="btn secondary" style="margin-top:8px" onclick="openExternal('${j.title}')">فتح مصدر الفرصة</button></div></div>`}function fav(id){state.fav=state.fav.includes(id)?state.fav.filter(x=>x!==id):[...state.fav,id];save();render()}function openExternal(title){if(window.InWork&&InWork.openUrl)InWork.openUrl('https://www.openstreetmap.org/search?query='+encodeURIComponent(title));else window.open('https://www.openstreetmap.org','_blank')}function locate(){if(window.InWork&&InWork.requestLocation){InWork.requestLocation();return}if(!navigator.geolocation)return toast('تحديد الموقع غير متاح');navigator.geolocation.getCurrentPosition(p=>{user={...user,lat:p.coords.latitude,lon:p.coords.longitude};save();render()},()=>toast('اسمح للتطبيق باستخدام الموقع ثم أعد المحاولة.'))}function receiveLocation(lat,lon){user={...user,lat,lon};save();render()}function exportProfile(){let b=new Blob([JSON.stringify(user,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='inwork-profile.json';a.click()}function toast(t){state.toast=t;render();setTimeout(()=>{state.toast='';render()},1800)}function resetAll(){localStorage.clear();user=base();state={screen:'welcome',step:0,detail:null,fav:[],toast:''};render()}function render(){save();let h=state.screen==='welcome'?welcome():state.screen==='legal'?legal():state.screen==='register'?register():state.screen==='profile'?profile():state.screen==='home'?home():state.screen==='map'?map():state.screen==='saved'?saved():state.screen==='profileScreen'?profileScreen():home();document.getElementById('app').innerHTML=h+(state.detail?detail():'')+(state.toast?`<div class="modal"><div class="sheet"><b>تم</b><p class="meta">${esc(state.toast)}</p></div></div>`:'')}window.receiveLocation=receiveLocation;render();</script></body></html>
