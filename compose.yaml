services:
  inwork:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${INWORK_PORT:-8000}:8000"
    environment:
      INWORK_DB_PATH: /data/inwork.sqlite3
      INWORK_COOKIE_SAMESITE: strict
      INWORK_ADMIN_BOOTSTRAP_TOKEN: ${INWORK_ADMIN_BOOTSTRAP_TOKEN:?Set a long random bootstrap token}
    volumes:
      - inwork-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  inwork-data:
