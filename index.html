<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><title>InWork — اطلب خدمة أو قدّم مهنتك</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--blue:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:760px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 10px 40px #0f172a0d}.top{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:950;color:var(--blue)}.brand span{color:#0f172a}.content{padding:20px}.hero{padding:30px 22px;background:linear-gradient(145deg,#eff6ff,#fff 65%)}h1{font-size:34px;line-height:1.35;margin:8px 0}h2{font-size:23px;margin:5px 0 15px}h3{margin:0 0 10px}.lead{color:var(--muted);line-height:1.9;font-weight:700}.muted,.hint{color:var(--muted);font-size:13px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;margin:10px 0}.role{border:2px solid #dbeafe;background:#f8fbff;text-align:right;min-height:120px}.role strong{font-size:20px;display:block;margin-bottom:8px}.field{margin:14px 0}.label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.inp{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px;background:#fff;outline:none}.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18}textarea.inp{min-height:105px;resize:vertical}.btn{border:0;background:var(--blue);color:#fff;border-radius:13px;padding:13px 17px;font-weight:900}.btn.secondary{background:#eff6ff;color:#1d4ed8}.btn.ghost{background:#fff;color:#475569;border:1px solid var(--line)}.btn.danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.5;cursor:not-allowed}.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}.success{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.error{background:#fee2e2;color:#991b1b}.notice{padding:12px;border-radius:12px;background:#eff6ff;color:#1e40af;font-size:13px;line-height:1.8;margin:12px 0}.hidden{display:none!important}.map{height:320px;border-radius:16px;border:1px solid var(--line);margin:12px 0;z-index:1}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.status{font-weight:900}.footer{padding:20px;text-align:center;color:#94a3b8;font-size:11px}
@media(max-width:520px){.content{padding:16px}.hero{padding:24px 17px}h1{font-size:29px}.map{height:270px}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand">◈ <span>InWork</span></div><button class="btn ghost" id="logoutBtn" onclick="logout()" hidden>تسجيل الخروج</button></header>
<div id="view"></div><footer class="footer">InWork — وصل طالب الخدمة بمقدم الخدمة مباشرة</footer>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $=id=>document.getElementById(id);
const state={user:null,categories:[],lat:null,lon:null,map:null,markers:[],requestId:null};
let apiBase=(localStorage.getItem('inwork_api_base')||'').replace(/\/$/,'');
function api(path){return apiBase+path}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(html){$('view').innerHTML=html; $('logoutBtn').hidden=!state.user}
function msg(text,type){const el=$('message');if(el){el.className='notice '+(type||'');el.textContent=text}}
async function call(path,options){options=options||{};options.credentials='include';options.headers=Object.assign({'Content-Type':'application/json','X-InWork-Request':'1'},options.headers||{});let r;try{r=await fetch(api(path),options)}catch(e){throw new Error('تعذر الاتصال بالخادم. راجع عنوان API واتصال الإنترنت.')}let data={};try{data=await r.json()}catch(e){}if(!r.ok)throw new Error(data.detail||('خطأ HTTP '+r.status));return data}
function configBox(){return '<div class="card"><label class="label">عنوان خادم InWork API (HTTPS)</label><input class="inp" id="apiBase" dir="ltr" placeholder="https://api.example.com" value="'+esc(apiBase)+'"><div class="hint">أدخل عنوان الخادم الذي يستضيف FastAPI. لا تضع مسارات إضافية بعد اسم النطاق.</div><button class="btn secondary full" style="margin-top:9px" onclick="saveApi()">حفظ عنوان الخادم</button></div>'}
function saveApi(){let v=$('apiBase').value.trim().replace(/\/$/,'');if(v&&!/^https:\/\//.test(v)&&!/^http:\/\/localhost(:[0-9]+)?$/.test(v)){msg('استخدم HTTPS للخادم العام.','error');return}apiBase=v;localStorage.setItem('inwork_api_base',v);msg('تم حفظ عنوان API.','success')}
function landing(){show('<section class="hero"><span class="pill">سوق خدمات وحرفيين</span><h1>خدمة محتاجها؟<br>أو مهنة بتقدمها؟</h1><p class="lead">InWork يوصّل طالب الخدمة بمقدم الخدمة القريب منه. اتفقوا مباشرة على السعر والتفاصيل.</p><div class="grid"><button class="card role" onclick="authScreen(\'requester\',\'register\')"><strong>أحتاج خدمة</strong><span class="muted">اطلب فني أو متخصص قريب منك</span></button><button class="card role" onclick="authScreen(\'worker\',\'register\')"><strong>أقدم خدمة</strong><span class="muted">اعرض مهنتك واستقبل طلبات قريبة</span></button></div><div class="actions"><button class="btn secondary" onclick="authScreen(\'requester\',\'login\')">تسجيل الدخول</button></div></section><div class="content">'+configBox()+'<div class="notice">لا توجد حسابات تجريبية أو طلبات وهمية. يلزم الاتصال بخادم API فعلي حتى تعمل الخدمات.</div></div>')}
async function loadCategories(){let d=await call('/v1/categories',{method:'GET',headers:{}});state.categories=d.categories||[]}
function categoryOptions(selected){return state.categories.map(c=>'<option value="'+c.id+'" '+(String(selected||'')===String(c.id)?'selected':'')+'>'+esc(c.name_ar)+'</option>').join('')}
function authScreen(role,mode){let register=mode==='register';show('<div class="content"><button class="btn ghost" onclick="landing()">رجوع</button><h2 style="margin-top:18px">'+(register?'إنشاء حساب جديد':'تسجيل الدخول')+'</h2><div class="field"><label class="label">البريد الإلكتروني</label><input class="inp" id="email" type="email" autocomplete="email"></div>'+(register?'<div class="field"><label class="label">الاسم الظاهر</label><input class="inp" id="displayName" maxlength="80"></div><div class="field"><label class="label">نوع الحساب</label><select class="inp" id="role" onchange="toggleWorkerCategory()"><option value="requester" '+(role==='requester'?'selected':'')+'>طالب خدمة</option><option value="worker" '+(role==='worker'?'selected':'')+'>مقدم خدمة</option></select></div><div class="field hidden" id="categoryField"><label class="label">التخصص الرئيسي</label><select class="inp" id="category"><option value="">اختر التخصص</option>'+categoryOptions()+'</select></div>':'')+'<div class="field"><label class="label">كلمة المرور (12 حرفًا على الأقل)</label><input class="inp" id="password" type="password" minlength="12" autocomplete="'+(register?'new-password':'current-password')+'"></div><div id="message"></div><button class="btn full" onclick="'+(register?'register()':'login()')+'">'+(register?'إنشاء الحساب':'دخول')+'</button><p class="hint">'+(register?'لديك حساب؟ <a href="#" onclick="authScreen(\''+role+'\',\'login\');return false">سجل الدخول</a>':'ليس لديك حساب؟ <a href="#" onclick="authScreen(\''+role+'\',\'register\');return false">أنشئ حسابًا</a>')+'</p></div>');toggleWorkerCategory();if(!state.categories.length)loadCategories().then(()=>{if($('category'))$('category').innerHTML='<option value="">اختر التخصص</option>'+categoryOptions()}).catch(e=>msg(e.message,'error'))}
function toggleWorkerCategory(){let el=$('categoryField');if(el)el.classList.toggle('hidden',$('role').value!=='worker')}
async function register(){try{let role=$('role').value;let d=await call('/v1/auth/register',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value,display_name:$('displayName').value,role:role,category_id:role==='worker'?Number($('category').value):null})});state.user=d.user;await dashboard()}catch(e){msg(e.message,'error')}}
async function login(){try{let d=await call('/v1/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});state.user=d.user;await dashboard()}catch(e){msg(e.message,'error')}}
async function logout(){try{await call('/v1/auth/logout',{method:'POST'})}catch(e){}state.user=null;dashboard()}
async function boot(){if(!apiBase){landing();return}try{let d=await call('/v1/auth/me',{method:'GET',headers:{}});state.user=d.user;await dashboard()}catch(e){landing()}}
async function dashboard(){if(!state.user){landing();return}if(state.user.role==='requester')requesterHome();else if(state.user.role==='worker')workerHome();else adminHome()}
function getLocation(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('المتصفح لا يدعم تحديد الموقع'));navigator.geolocation.getCurrentPosition(p=>{state.lat=p.coords.latitude;state.lon=p.coords.longitude;resolve({latitude:state.lat,longitude:state.lon})},()=>reject(new Error('تعذر تحديد الموقع. اسمح باستخدام الموقع أو حاول لاحقًا.' )),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})})}
async function requesterHome(){try{await loadCategories()}catch(e){}show('<div class="content"><h2>أهلًا '+esc(state.user.display_name)+'</h2><p class="muted">أنشئ طلبك وحدد موقع الخدمة، وسنبحث عن مقدمي الخدمة القريبين.</p><div class="card"><h3>طلب خدمة جديد</h3><div class="field"><label class="label">التخصص</label><select class="inp" id="reqCategory"><option value="">اختر التخصص</option>'+categoryOptions()+'</select></div><div class="field"><label class="label">وصف الخدمة</label><textarea class="inp" id="reqDescription" maxlength="2000" placeholder="اشرح المطلوب باختصار..."></textarea></div><div class="row"><span class="hint" id="locationState">لم يتم تحديد الموقع بعد</span><button class="btn secondary" onclick="locate()">تحديد موقعي</button></div><div id="message"></div><button class="btn full" style="margin-top:12px" onclick="createServiceRequest()">إنشاء الطلب والبحث عن فني قريب</button></div><div id="results"></div><div class="actions"><button class="btn ghost" onclick="myRequests()">طلباتي</button></div></div>')}
async function locate(){try{await getLocation();if($('locationState'))$('locationState').textContent='تم تحديد موقعك بنجاح';if($('workerLocation'))$('workerLocation').textContent='الموقع جاهز: '+state.lat.toFixed(4)+', '+state.lon.toFixed(4)}catch(e){if($('message'))msg(e.message,'error');else alert(e.message)}}
async function createServiceRequest(){try{if(state.lat==null)await getLocation();let id=Number($('reqCategory').value);if(!id)throw new Error('اختر التخصص أولًا');let description=$('reqDescription').value.trim();if(description.length<5)throw new Error('اكتب وصفًا أوضح للخدمة');let d=await call('/v1/requests',{method:'POST',body:JSON.stringify({category_id:id,description:description,latitude:state.lat,longitude:state.lon})});state.requestId=d.id;let found=await call('/v1/workers/search?category_id='+id+'&latitude='+state.lat+'&longitude='+state.lon+'&radius_km=25',{method:'GET',headers:{}});renderWorkers(found.workers||[],d.id)}catch(e){msg(e.message,'error')}}
function renderWorkers(workers,requestId){let html='<div class="card"><div class="row"><h3>مقدمو الخدمة القريبون</h3><span class="pill">'+workers.length+' نتيجة</span></div><div id="workerMap" class="map"></div>';html+=workers.map(w=>'<div class="card"><b>'+esc(w.display_name)+'</b><div class="muted">'+esc(w.category)+' · '+w.distance_km+' كم</div><p>'+esc(w.bio)+'</p></div>').join('')||'<p class="muted">لا يوجد مقدم خدمة نشط قريب حاليًا. سيظل طلبك مفتوحًا لاستقبال المطابقين.</p>';html+='<p class="hint">رقم الهاتف وموقع العامل الدقيق غير معروضين. مشاركة الاتصال متاحة بعد قبول الطلب وموافقتك.</p><button class="btn ghost" onclick="myRequests()">متابعة حالة الطلب</button></div>';$('results').innerHTML=html;drawMap(workers,state.lat,state.lon)}
function drawMap(workers,lat,lon){if(!window.L)return;try{if(state.map){state.map.remove();state.map=null}state.map=L.map('workerMap').setView([lat,lon],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(state.map);L.marker([lat,lon]).addTo(state.map).bindPopup('موقع طلبك');workers.forEach(w=>L.marker([w.latitude,w.longitude]).addTo(state.map).bindPopup(esc(w.display_name)+' · '+w.distance_km+' كم'))}catch(e){}}
function requestCard(r){
 let html='<div class="card"><div class="row"><b>#'+r.id+' · '+esc(r.category)+'</b><span class="pill">'+esc(r.status)+'</span></div><p>'+esc(r.description)+'</p><div class="muted">'+esc(r.other_party||'بانتظار مقدم الخدمة')+'</div>';
 if(r.status==='accepted'||r.status==='in_progress'){
  html+='<div class="actions">';
  if(state.user.role==='requester')html+='<button class="btn secondary" onclick="shareContact('+r.id+')">موافقة على مشاركة بيانات الاتصال</button>';
  html+='<button class="btn ghost" onclick="showContact('+r.id+')">عرض الاتصال بعد الموافقة</button>';
  if(state.user.role==='worker'&&r.status==='accepted')html+='<button class="btn" onclick="updateRequestStatus('+r.id+',\'in_progress\')">بدء التنفيذ</button>';
  if(state.user.role==='worker'&&r.status==='in_progress')html+='<button class="btn" onclick="updateRequestStatus('+r.id+',\'completed\')">إتمام الخدمة</button>';
  html+='</div>';
 }
 if(state.user.role==='requester'&&r.status==='completed'&&!r.has_review){
  html+='<div class="field"><label class="label">تقييم مقدم الخدمة</label><select class="inp" id="rating-'+r.id+'"><option value="5">5 — ممتاز</option><option value="4">4 — جيد جدًا</option><option value="3">3 — جيد</option><option value="2">2 — مقبول</option><option value="1">1 — ضعيف</option></select><input class="inp" id="review-'+r.id+'" placeholder="تعليق اختياري" style="margin-top:8px"><button class="btn secondary full" style="margin-top:8px" onclick="submitReview('+r.id+')">إرسال التقييم</button></div>';
 }else if(state.user.role==='requester'&&r.status==='completed'&&r.has_review){
  html+='<span class="pill success">تم إرسال التقييم</span>';
 }
 if(state.user.role==='requester'&&r.status==='open')html+='<button class="btn danger" onclick="cancelRequest('+r.id+')">إلغاء الطلب</button>';
 return html+'</div>';
}
async function myRequests(){
 try{
  let d=await call('/v1/requests/mine',{method:'GET',headers:{}});
  let cards=(d.requests||[]).map(requestCard).join('');
  show('<div class="content"><button class="btn ghost" onclick="dashboard()">رجوع</button><h2>طلباتي</h2>'+(cards||'<p class="muted">لا توجد طلبات حتى الآن.</p>')+'</div>');
 }catch(e){alert(e.message)}
}
async function shareContact(id){try{await call('/v1/requests/'+id+'/share-contact',{method:'POST'});alert('تمت الموافقة. أصبح بإمكان الطرفين رؤية وسيلة الاتصال.');myRequests()}catch(e){alert(e.message)}}
async function showContact(id){try{let d=await call('/v1/requests/'+id+'/contact',{method:'GET',headers:{}});let c=d.contact;alert('الهاتف: '+(c.phone||'غير متاح')+'\nواتساب: '+(c.whatsapp||'غير متاح'))}catch(e){alert(e.message)}}
async function cancelRequest(id){try{await call('/v1/requests/'+id+'/cancel',{method:'POST'});myRequests()}catch(e){alert(e.message)}}
async function workerHome(){show('<div class="content"><h2>أهلًا '+esc(state.user.display_name)+'</h2><p class="muted">حدّث ملفك وموقعك لتظهر لطالبي الخدمة القريبين.</p><div class="card"><h3>ملفي المهني</h3><div class="field"><label class="label">نبذة مختصرة</label><textarea class="inp" id="bio" maxlength="1000"></textarea></div><div class="field"><label class="label">رقم الهاتف (خاص)</label><input class="inp" id="phone" type="tel"></div><div class="field"><label class="label">رقم واتساب (خاص)</label><input class="inp" id="whatsapp" type="tel"></div><div class="row"><span id="workerLocation" class="hint">حدد موقعك</span><button class="btn secondary" onclick="locate()">تحديد موقعي</button></div><button class="btn full" style="margin-top:12px" onclick="saveWorkerProfile()">حفظ الملف المهني</button></div><div class="card"><h3>اشتراك مقدم الخدمة</h3><p class="muted">100 جنيه لمدة 30 يومًا. التفعيل بعد مراجعة الإدارة يدويًا، دون بوابة دفع.</p><button class="btn secondary" onclick="requestSubscription()">طلب مراجعة الاشتراك</button></div><div class="actions"><button class="btn" onclick="workerRequests()">الطلبات القريبة</button><button class="btn ghost" onclick="myRequests()">طلباتي المقبولة</button></div><div id="message"></div></div>')}
async function saveWorkerProfile(){try{if(state.lat==null)await getLocation();await call('/v1/worker/profile',{method:'PUT',body:JSON.stringify({bio:$('bio').value,latitude:state.lat,longitude:state.lon,available:true,phone:$('phone').value||null,whatsapp:$('whatsapp').value||null})});msg('تم حفظ الملف المهني. بيانات الاتصال خاصة.','success')}catch(e){msg(e.message,'error')}}
async function requestSubscription(){try{let d=await call('/v1/worker/subscription',{method:'POST'});alert('تم إنشاء طلب اشتراك بقيمة '+d.amount_egp+' جنيه. أرسل إثبات الدفع للإدارة بالطريقة المتفق عليها.');}catch(e){alert(e.message)}}
function workerRequestCard(r){
 return '<div class="card"><div class="row"><b>#'+r.id+' · '+esc(r.category)+'</b><span class="pill">'+(r.distance_km==null?'المسافة غير محددة':r.distance_km+' كم')+'</span></div><p>'+esc(r.description)+'</p><div class="muted">طالب الخدمة: '+esc(r.requester_name)+'</div><button class="btn full" style="margin-top:10px" onclick="acceptRequest('+r.id+')">قبول الطلب</button></div>';
}
async function workerRequests(){
 try{
  let d=await call('/v1/worker/requests',{method:'GET',headers:{}});
  let cards=(d.requests||[]).map(workerRequestCard).join('');
  show('<div class="content"><button class="btn ghost" onclick="dashboard()">رجوع</button><h2>طلبات مناسبة لتخصصك</h2>'+(cards||'<p class="muted">لا توجد طلبات مفتوحة مطابقة حاليًا.</p>')+'</div>');
 }catch(e){alert(e.message)}
}
async function acceptRequest(id){try{await call('/v1/requests/'+id+'/accept',{method:'POST'});alert('تم قبول الطلب.');workerRequests()}catch(e){alert(e.message)}}
async function adminHome(){show('<div class="content"><h2>لوحة الإدارة</h2><p class="muted">مراجعة الاشتراكات وإدارة التخصصات.</p><div class="card"><label class="label">اسم التخصص الجديد</label><input id="newCategory" class="inp"><button class="btn full" style="margin-top:10px" onclick="addCategory()">إضافة تخصص</button></div><div class="card"><div class="row"><h3>طلبات الاشتراك المعلقة</h3><button class="btn ghost" onclick="adminHome()">تحديث</button></div><div id="pendingSubs" class="muted">جارٍ التحميل...</div></div></div>');try{let d=await call('/v1/admin/subscriptions/pending',{method:'GET',headers:{}});let el=$('pendingSubs');if(!el)return;el.innerHTML=(d.subscriptions||[]).map(s=>'<div class="card"><b>#'+s.id+' · '+esc(s.worker_name)+'</b><div class="muted">'+esc(s.worker_email)+' · '+s.amount_egp+' جنيه</div><button class="btn full" style="margin-top:8px" onclick="verifySubscription('+s.id+')">تأكيد الاستلام وتفعيل 30 يومًا</button></div>').join('')||'لا توجد طلبات معلقة.'}catch(e){let el=$('pendingSubs');if(el)el.textContent=e.message}}
async function addCategory(){try{let d=await call('/v1/admin/categories',{method:'POST',body:JSON.stringify({name_ar:$('newCategory').value})});alert('تمت إضافة: '+d.name_ar)}catch(e){alert(e.message)}}
async function verifySubscription(id){try{await call('/v1/admin/subscriptions/'+id+'/verify',{method:'POST'});adminHome()}catch(e){alert(e.message)}}

async function updateRequestStatus(id,status){try{await call('/v1/requests/'+id+'/status',{method:'POST',body:JSON.stringify({status:status})});myRequests()}catch(e){alert(e.message)}}

async function submitReview(id){try{let rating=Number($('rating-'+id).value);let comment=$('review-'+id).value||'';await call('/v1/requests/'+id+'/review',{method:'POST',body:JSON.stringify({rating:rating,comment:comment})});alert('شكرًا لك، تم تسجيل تقييمك.');myRequests()}catch(e){alert(e.message)}}
boot();
</script></body></html>
