<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>InWork — فرص شغل تناسبك</title><style> :root{--p:#4f46e5;--p2:#4338ca;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}*{box-sizing:border-box}body{margin:0;background:#0f172a;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg)}.screen{min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:5;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid #eef2f7;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:var(--p);display:flex;gap:6px;align-items:center}.back{border:0;background:none;font-size:25px;color:#64748b}.pad{padding:20px}.hero{min-height:100vh;padding:24px;display:flex;flex-direction:column}.spacer{flex:1}.logo{width:82px;height:82px;border-radius:26px;background:linear-gradient(135deg,#6366f1,#7c3aed);display:grid;place-items:center;color:#fff;font-size:40px;box-shadow:0 18px 40px #4f46e53b;margin-bottom:20px}.h1{font-size:42px;line-height:1.1;margin:0;font-weight:950}.lead{font-size:20px;line-height:1.8;color:var(--muted);font-weight:700}.btn{width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:900;font-size:16px;background:var(--p);color:#fff;box-shadow:0 10px 22px #4f46e53a}.btn:disabled{background:#e2e8f0;color:#94a3b8;box-shadow:none;cursor:not-allowed}.btn.secondary{background:#fff;color:#475569;border:2px solid var(--line);box-shadow:none}.btn.google{background:#fff;color:#334155;border:2px solid var(--line);box-shadow:none;display:flex;justify-content:center;gap:10px;align-items:center}.field{margin:15px 0}.label{font-weight:800;font-size:14px;display:block;margin-bottom:7px}.inp{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;background:#fff}.inp:focus{border-color:#818cf8;box-shadow:0 0 0 3px #4f46e522}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:2px solid var(--line);background:#fff;color:#64748b;border-radius:12px;padding:9px 12px;font-weight:800}.chip.on{border-color:var(--p);background:#eef2ff;color:var(--p2)}.box{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px}.notice{padding:12px 14px;border-radius:14px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-weight:700;font-size:12px;line-height:1.7}.divider{display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:12px;font-weight:800;margin:15px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.section{margin:18px 0}.section h3{margin:0 0 5px;font-size:18px}.section p{margin:0;color:#94a3b8;font-size:12px;font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 5px 18px #0f172a08}.cardhead{display:flex;justify-content:space-between;gap:10px}.tag{font-size:11px;font-weight:900;padding:5px 9px;border-radius:999px;white-space:nowrap}.high{background:#d1fae5;color:#047857}.mid{background:#e0e7ff;color:#4338ca}.low{background:#fef3c7;color:#92400e}.meta{font-size:12px;color:#64748b;font-weight:700;line-height:1.8}.money{font-size:15px;font-weight:950;color:#0f172a}.small{font-size:11px;color:#94a3b8;font-weight:700}.modal{position:fixed;inset:0;background:#0f172a66;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);background:#fff;border-radius:24px 24px 0 0;padding:22px;max-height:88vh;overflow:auto}.tabs{display:flex;gap:7px;margin:12px 0}.tab{flex:1;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:12px}.tab.on{border-color:#7c3aed;background:#f5f3ff;color:#6d28d9}.spin{width:44px;height:44px;border:5px solid #e2e8f0;border-top-color:var(--p);border-radius:50%;animation:r 1s linear infinite;margin:auto}@keyframes r{to{transform:rotate(360deg)}}.footer{text-align:center;font-size:10px;color:#94a3b8;font-weight:800;padding:12px}@media(min-width:700px){.app{box-shadow:0 0 50px #0004}}</style></head><body><main id="app" class="app"></main><script>const GOVS=['القاهرة','الجيزة','الإسكندرية','الدقهلية','الشرقية','المنوفية','الغربية','كفر الشيخ','البحيرة','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','بورسعيد','السويس','الإسماعيلية','دمياط','الفيوم','بني سويف','مطروح','البحر الأحمر'];const AGES=['أقل من 18','18–24','25–34','35–44','45–54','55 فما فوق'];const FIELDS=['مبيعات','خدمة عملاء','تعليم','صحة','تقنية / كمبيوتر','تصميم','مطبخ وطعام','حرف يدوية','محاسبة','إدارة وتنظيم','مواصلات / توصيل','مصانع وورش','غير كده'];const YEARS=['لسه بادئ / من غير خبرة','أقل من سنة','سنة لـ 3 سنين','3 لـ 5 سنين','5 لـ 10 سنين','أكتر من 10 سنين'];const SKILLS=['كمبيوتر','Excel','Word','تنظيم','تواصل','خدمة عملاء','مبيعات','تسويق','كتابة','إدارة وقت','برمجة','Frontend','HTML','واجهات','تصميم','Canva','مونتاج','سوشيال ميديا','تصوير','طبخ','خياطة','تطريز','صيانة','قيادة','محاسبة','إدخال بيانات'];const OPS=[{id:1,title:'Virtual Assistant',type:'Remote · Freelance',cur:'USD',pay:'$300–700 / شهر',exp:0,lang:'en',tags:['تنظيم','تواصل','كمبيوتر','إدارة وقت'],inter:['إدارة وتنظيم','خدمة عملاء'],surprise:true,desc:'مساعدة عن بُعد في تنظيم المواعيد والملفات والتواصل مع العملاء.'},{id:2,title:'Customer Support',type:'Remote · دوام جزئي',cur:'USD',pay:'$250–600 / شهر',exp:1,lang:'en',tags:['تواصل','خدمة عملاء','كمبيوتر'],inter:['خدمة عملاء','مبيعات'],surprise:false,desc:'دعم عملاء عبر الدردشة والبريد ومتابعة الطلبات.'},{id:3,title:'Data Entry',type:'من البيت · Freelance',cur:'USD',pay:'$200–500 / شهر',exp:0,lang:'en',tags:['كمبيوتر','Excel','كتابة','إدخال بيانات'],int تخرج',skills:['كمبيوتر','Excel','تواصل','كتابة'],langs:{عربي:'ممتاز',إنجليزي:'متوسط'},exp:1,prefs:['Remote','دوام جزئي'],inter:['تقنية / كمبيوتر','إدارة وتنظيم']},{name:'سارة',emoji:'🎨',age:'29',gov:'الجيزة',tag:'مصممة',skills:['تصميم','Canva','سوشيال ميديا','تصوير'],langs:{عربي:'ممتاز',إنجليزي:'متوسط'},exp:2,prefs:['Remote','Freelance'],inter:['تصميم']},{name:'محمد',emoji:'🧮',age:'38',gov:'الإسكندرية',tag:'محاسب',skills:['محاسبة','Excel','تنظيم'],langs:{عربي:'ممتاز',إنجليزي:'محدود'},exp:4,prefs:['دوام جزئي','من البيت'],inter:['محاسبة','إدارة وتنظيم']},{name:'أم عبده',emoji:'👩‍🍳',age:'46',gov:'الشرقية',tag:'شغل بيتي',skills:['خياطة','تطريز','طبخ','تواصل'],langs:{عربي:'ممتاز'},exp:5,prefs:['من البيت','مشروع'],inter:['حرف يدوية','مطبخ وطعام']},{name:'الحاج سيد',emoji:'🧓',age:'61',gov:'المنوفية',tag:'دخل إضافي',skills:['قيادة','تواصل','تنظيم'],langs:{عربي:'ممتاز'},exp:5,prefs:['مشروع','دوام جزئي'],inter:['مواصلات / توصيل']}];function base(){return{name:'',gov:'',age:'',contact:'',status:'',fields:[],skills:[],langs:{عربي:'ممتاز'},exp:'0',prefs:[],interests:[],note:''}}function results(u){let en=!!u.langs?.إنجليزي,exp=+u.exp||0,sk=new Set(u.skills||[]),ins=new Set(u.interests||u.fields||[]),rows=[];OPS.forEach(o=>{if(o.lang==='en'&&!en)return;let overlap=0;o.tags.forEach(t=>{if(sk.has(t))overlap++});let ih=o.inter.some(x=>ins.has(x)),expOk=exp>=o.exp,level=null;if(overlap>=2||(overlap===1&&ih&&expOk))level='high';else if(overlap===1)level='mid';else if(expOk&&(ih||(o.lang==='en'&&en)))level='low';if(level&&expOk)rows.push({o,level,overlap,ih})});let surprise=rows.filter(r=>r.o.surprise),normal=rows.filter(r=>!r.o.surprise);return{rows,high:normal.filter(r=>r.level==='high').sort((a,b)=>b.overlap-a.overlap),mid:normal.filter(r=>r.level==='mid').sort((a,b)=>b.overlap-a.overlap),low:normal.filter(r=>r.level==='low').sort((a,b)=>b.overlap-a.overlap),surprise,count:rows.length,coursesShow:rows.length<=3||(u.skills||[]).length<=2||exp===0}}function filtered(rows,fs){if(!fs.length)return rows;return rows.filter(r=>fs.some(f=>({remote:r=>r.o.type.includes('Remote'),home:r=>r.o.type.includes('من البيت'),freelance:r=>r.o.type.includes('Freelance'),full:r=>r.o.type.includes('دوام كامل'),part:r=>r.o.type.includes('دوام جزئي'),project:r=>r.o.type.includes('مشروع'),noexp:r=>r.o.exp===0,egp:r=>r.o.cur==='EGP',usd:r=>r.o.cur==='USD'})[f]?.(r)))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}let state={screen:'welcome',u:JSON.parse(localStorage.getItem('inwork_user')||'null')||base(),agreed:localStorage.getItem('inwork_agreed')==='1',step:0,detail:null,course:null,filters:[],adminTab:'personas',persona:0,toast:''};function save(){localStorage.setItem('inwork_user',JSON.stringify(state.u));localStorage.setItem('inwork_agreed',state.agreed?'1':'0')}function setU(p){state.u={...state.u,...p};save();render()}function go(s){state.screen=s;render()}function topBar(back){return`<div class="top"><button class="back" onclick="go('${back||'welcome'}')">‹</button><div class="brand">◈ InWork</div><div style="width:28px"></div></div>`}function chip(label,on,fn){return`<button class="chip ${on?'on':''}" onclick="${fn}">${esc(label)}</button>`}function field(label,value,ph,key){return`<div class="field"><label class="label">${label}</label><input class="inp" placeholder="${ph}" value="${esc(value)}" oninput="setU({${key}:this.value})"></div>`}function welcome(){return`<section class="screen hero"><div><button class="chip" style="float:left;font-size:11px" onclick="go('admin')">وضع الإدارة (Demo)</button></div><div class="spacer"></div><div><div class="logo">◈</div><h1 class="h1">InWork</h1><p class="lead">خلّي فرص الشغل<br>تيجي لحد عندك.</p><button class="btn" onclick="go('legal')">يلا نبدأ</button><p class="small" style="text-align:center;margin-top:10px">دقيقة واحدة — وهتبقى عارف إنت ممكن تشتغل إيه</p></div><div class="spacer"></div></section>`}function legal(){return`<section class="screen">${topBar('welcome')}<div class="pad"><h2>إتفاقية الاستخدام</h2><div class="box" style="max-height:52vh;overflow:auto;line-height:1.9;color:#475569;font-size:13px"><b>1) إيه هي InWork؟</b><p>منصة بتساعدك تكتشف فرص شغل ومشاريع مناسبة لمهاراتك وخبرتك. إحنا بنقترح — وانت صاحب القرار النهائي.</p><b>2) بياناتك</b><p>بنستخدم بياناتك عشان نطلع فرص أنسب. في النسخة التجريبية البيانات محفوظة على جهازك.</p><b>3) الفرص مش ضمان شغل</b><p>الدخل المعروض تقديري أو نطاق معلن، ومش ضمان لأي دخل.</p><b>4) إخلاء مسؤولية</b><p>InWork مش مسؤولة عن نتيجة التعاقد مع أي طرف تالت أو صحة إعلان خارجي.</p></div><div class="notice" style="margin-top:12px">النص تجريبي ويحتاج مراجعة قانونية قبل الإطلاق التجاري.</div><label style="display:flex;gap:10px;align-items:flex-start;margin:15px 0;font-weight:800;font-size:13px"><input type="checkbox" ${state.agreed?'checked':''} onchange="state.agreed=this.checked;save();render()"> أنا موافق على الشروط والأحكام وإخلاء المسؤولية</label><button class="btn" ${state.agreed?'':'disabled'} onclick="go('register')">موافق ونكمل</button></div></section>`}function register(){let u=state.u;return`<section class="screen">${topBar('legal')}<div class="pad"><h2>أهلاً بيك 👋</h2><p class="meta">سجّل بياناتك الأساسية — دقيقة واحدة بس</p><button class="btn google" onclick="googleDemo()"><b style="font-size:20px">G</b> التسجيل بحساب Google</button><div class="divider">أو كمّل كضيف</div>${field('اسمك',u.name,'اكتب اسمك','name')}<div class="field"><label class="label">المحافظة / المنطقة</label><select class="inp" onchange="setU({gov:this.value})"><option value="">اختار محافظتك</option>${GOVS.map(g=>`<option ${u.gov===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label class="label">الفئة العمرية</label><div class="chips">${AGES.map(a=>chip(a,u.age===a,`setU({age:'${a}'})`)).join('')}</div></div>${field('وسيلة تواصل (موبايل أو إيميل)',u.contact,'مثال: 01xxxxxxxxx','contact')}<button class="btn" ${u.name&&u.gov&&u.age&&u.contact?'':'disabled'} onclick="state.step=0;go('profile')">كمّل بياناتك عشان نطلعلك فرص أنسب</button></div></section>`}function googleDemo(){state.u={...state.u,googleSignedIn:true,contact:state.u.contact||'Google account',name:state.u.name||'مستخدم Google'};save();state.toast='تسجيل Google التجريبي جاهز. لو أضفت Client ID حقيقي هنفعل OAuth الكامل.';render()}function profile(){let u=state.u,step=state.step,body='';if(step===0)body=`<h2>إنت شغال إيه حاليًا؟</h2><p class="meta">ده يساعدنا نفهم خبرتك</p><div class="section"><label class="label">حالتك دلوقتي</label><div class="chips">${['لسه بذاكر / طالب','حديث التخرج','شغال حاليًا','بستنى شغل / عاطل','شغال من البيت','متفرغ / عندي وقت'].map(x=>chip(x,u.status===x,`setU({status:'${x}'})`)).join('')}</div></div><div class="section"><label class="label">مجالات اشتغلت فيها</label><div class="chips">${FIELDS.map(x=>chip(x,u.fields.includes(x),`toggleArr('fields','${x}')`)).join('')}</div></div>`;if(step===1)body=`<h2>مهاراتك</h2><p class="meta">اختار اللي تعرف تعمله فعلًا</p><div class="chips" style="margin-top:14px">${SKILLS.map(x=>chip(x,u.skills.includes(x),`toggleArr('skills','${x}')`)).join('')}</div>`;if(step===2)body=`<h2>لغاتك وخبرتك</h2><p class="meta">مش محتاج تكون خبير</p><div class="section"><label class="label">الإنجليزي</label><div class="chips">${['محدود','متوسط','جيد','ممتاز'].map(x=>chip(x,u.langs?.إنجليزي===x,`setLang('${x}')`)).join('')}</div></div><div class="section"><label class="label">سنين الخبرة</label><div class="chips">${YEARS.map((x,i)=>chip(x,u.exp==i,`setU({exp:'${i}'})`)).join('')}</div></div>`;if(step===3)body=`<h2>تفضيلاتك</h2><p class="meta">خلّينا نقرّب النتائج ليك</p><div class="section"><label class="label">طريقة الشغل</label><div class="chips">${['Remote','من البيت','Freelance','دوام كامل','دوام جزئي','مشروع'].map(x=>chip(x,u.prefs.includes(x),`toggleArr('prefs','${x}')`)).join('')}</div></div><div class="section"><label class="label">اهتماماتك</label><div class="chips">${FIELDS.map(x=>chip(x,u.interests.includes(x),`toggleArr('interests','${x}')`)).join('')}</div></div>`;return`<section class="screen">${topBar(step?'profile':'register')}<div class="pad">${body}<div style="display:flex;gap:8px;margin-top:25px"><button class="btn secondary" onclick="${step?'state.step--;render()':'go(\'register\')'}">رجوع</button><button class="btn" onclick="${step<3?'state.step++;render()':'go(\'voice\')'}">${step<3?'التالي':'تمام — ورّيني الفرص'}</button></div><div class="small" style="text-align:center;margin-top:10px">خطوة ${step+1} من 4</div></div></section>`}function toggleArr(k,v){let a=state.u[k]||[];setU({[k]:a.includes(v)?a.filter(x=>x!==v):[...a,v]})}function setLang(v){setU({langs:{...state.u.langs,إنجليزي:v}})}function voice(){return`<section class="screen">${topBar('profile')}<div class="pad"><h2>اكتب أو قول — اختياري 🎙️</h2><p class="meta">احكي لنا عن نفسك أو سيبها علينا.</p><textarea class="inp" style="min-height:150px;margin-top:14px" placeholder="مثال: بحب التنظيم والتعامل مع الناس…" oninput="setU({note:this.value})">${esc(state.u.note)}</textarea><button class="btn secondary" style="margin-top:10px" onclick="state.u.note='';save();state.toast='الميكروفون في النسخة التجريبية محاكاة.';render()">🎙️ قول لنا بدل ما تكتب</button><button class="btn" style="margin-top:12px" onclick="analyze()">ورّيني الفرص</button><button class="btn secondary" style="margin-top:8px" onclick="go('results')">سيب ده وورّيني الفرص</button></div></section>`}function analyze(){go('loading');setTimeout(()=>go('results'),900)}function loading(){return`<section class="screen" style="display:grid;place-items:center;padding:30px;text-align:center"><div><div class="spin"></div><h2>تمام، بنشوف إيه اليناسبك…</h2><p class="meta">بنقارن مهاراتك وخبرتك ولغاتك واهتماماتك.</p></div></section>`}function resultsScreen(){let r=results(state.u),rows=filtered(r.rows,state.filters);return`<section class="screen">${topBar('welcome')}<div class="pad"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2 style="margin:0">لقينا لك فرص ✨</h2><p class="meta">${rows.length} فرصة متاحة في التجربة</p></div><button class="chip" onclick="filterModal()">⚙️ فلترة</button></div>${section('✨ فرص ممكن متكنش فكرت فيها',r.surprise.filter(x=>rows.includes(x)))}${section('🔥 مناسبة ليك جدًا',r.high.filter(x=>rows.includes(x)))}${section('💼 مناسبة ليك',r.mid.filter(x=>rows.includes(x)))}${section('👀 ممكن تناسبك',r.low.filter(x=>rows.includes(x)))}${r.coursesShow?courses():''}${!rows.length?`<div class="box" style="text-align:center;margin-top:18px"><b>محتاجين نعرف عنك أكتر</b><p class="meta">جرّب تعديل بياناتك أو الفلاتر.</p><button class="btn" style="margin-top:10px" onclick="go('profile')">عدّل بياناتي</button></div>`:''}<div class="notice" style="margin-top:18px">InWork بتقترح — وانت صاحب القرار ✓</div><button class="btn secondary" style="margin-top:10px" onclick="resetApp()">ابدأ من الأول</button></div></section>`}function section(title,arr){if(!arr.length)return'';return`<div class="section"><h3>${title}</h3>${arr.map(x=>card(x)).join('')}</div>`}function card(x){return`<button class="card" style="text-align:right;width:100%" onclick="openDetail(${x.o.id},'${x.level}')"><div class="cardhead"><div><b>${esc(x.o.title)}</b><div class="meta">${esc(x.o.type)} · ${x.o.cur}</div></div><span class="tag ${x.level}">${x.level==='high'?'مناسبة ليك جدًا':x.level==='mid'?'مناسبة ليك':'ممكن تناسبك'}</span></div><div class="money" style="margin-top:8px">${esc(x.o.pay)}</div></button>`}function courses(){return`<div class="section"><h3>🎓 مهارات هتفتح لك فرص أكتر</h3><p>لو الفرص قليلة، ناخد خطوة صغيرة للأمام.</p>${COURSES.map((c,i)=>`<button class="card" style="width:100%;text-align:right" onclick="state.course=${i};render()"><b>${c[0]}</b><div class="meta">${c[1]}</div><span class="small">مجاني بالكامل</span></button>`).join('')}</div>`}function openDetail(id,level){state.detail={o:OPS.find(o=>o.id===id),level};render()}function filterModal(){state.screen='filter';render()}function filterScreen(){let fs=state.filters,opts=[['remote','Remote'],['home','من البيت'],['freelance','Freelance'],['full','دوام كامل'],['part','دوام جزئي'],['project','مشروع'],['noexp','بدون خبرة'],['egp','بالجنيه'],['usd','بالدولار']];return`<section class="screen">${topBar('results')}<div class="pad"><h2>فلترة الفرص</h2><div class="chips">${opts.map(([k,l])=>chip(l,fs.includes(k),`toggleFilter('${k}')`)).join('')}</div><button class="btn" style="margin-top:20px" onclick="go('results')">تطبيق الفلترة</button></div></section>`}function toggleFilter(k){state.filters=state.filters.includes(k)?state.filters.filter(x=>x!==k):[...state.filters,k];render()}function detailModal(){if(!state.detail)return'';let x=state.detail;return`<div class="modal" onclick="state.detail=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="small">${x.o.type}</div><h2>${esc(x.o.title)}</h2><div class="money">${esc(x.o.pay)}</div><p style="line-height:1.9;color:#475569">${esc(x.o.desc)}</p><div class="box"><b>إزاي لقينا الفرصة دي؟</b><p class="meta">بنشوف مهاراتك وخبرتك ولغاتك واهتماماتك مع بعض، وبنقترح فرص نعتقد إنها مناسبة. إحنا بنقترح بس — وإنت صاحب القرار.</p></div><div class="notice" style="margin-top:10px">التقديم بيتم على المنصة الخارجية في النسخة الحقيقية. الرابط الحالي تجريبي.</div><button class="btn" style="margin-top:12px" onclick="state.detail=null;render()">تمام 👍</button></div></div>`}function courseModal(){if(state.course===null)return'';let c=COURSES[state.course];return`<div class="modal" onclick="state.course=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div style="font-size:42px">🎓</div><h2>${c[0]}</h2><p class="meta">${c[1]}</p><div class="notice" style="margin-top:10px">مجاني بالكامل — الرابط المباشر يتضاف في النسخة الحقيقية.</div><button class="btn" style="margin-top:12px" onclick="state.course=null;render()">تمام</button></div></div>`}function admin(){let p=PERSONAS[state.persona],u={...base(),name:p.name,gov:p.gov,age:p.age,skills:p.skills,langs:p.langs,exp:String(p.exp),prefs:p.prefs,interests:p.inter};let r=results(u);return`<section class="screen">${topBar('welcome')}<div class="pad"><span class="tag" style="background:#ede9fe;color:#6d28d9">وضع الإدارة — تجريبي</span><h2>Admin Demo</h2><p class="meta">النتائج تتغير حسب الشخصية.</p><div class="tabs"><button class="tab ${state.adminTab==='personas'?'on':''}" onclick="state.adminTab='personas';render()">👥 الشخصيات</button><button class="tab ${state.adminTab==='sources'?'on':''}" onclick="state.adminTab='sources';render()">🌐 المصادر</button><button class="tab ${state.adminTab==='flow'?'on':''}" onclick="state.adminTab='flow';render()">🔀 المنطق</button></div>${state.adminTab==='personas'?PERSONAS.map((x,i)=>`<button class="card" style="width:100%;text-align:right;border-width:${i===state.persona?2:1}px;border-color:${i===state.persona?'#7c3aed':'#e2e8f0'}" onclick="state.persona=${i};render()"><b>${x.emoji} ${x.name}</b><div class="meta">${x.age} · ${x.gov} · ${x.tag}</div><div class="small">${results({...base(),skills:x.skills,langs:x.langs,exp:String(x.exp),interests:x.inter}).count} فرصة</div></button>`).join('')+`<div class="box"><b>${p.name} — النتيجة الحالية: ${r.count} فرصة</b>${r.rows.map(x=>`<div class="meta" style="margin-top:6px">• ${x.o.title}</div>`).join('')}</div>`:state.adminTab==='sources'?`<div class="box" style="line-height:2"><b>مصادر تجريبية</b><div class="meta">إعلانات محلية · منصات عمل حر · منصات دولية · شركات · شبكات تواصل</div><div class="small">كلها Mock في هذه النسخة.</div></div>`:`<div class="box" style="line-height:2"><b>بيانات → تحليل → مهارات + لغات → اكتشاف → مطابقة → نتائج</b><div class="meta">حاجز اللغة يمنع فرص الإنجليزية عند غياب الإنجليزية، والتصنيف يعتمد على تداخل المهارات والاهتمامات والخبرة.</div></div>`}</div></section>`}function resetApp(){state={...state,screen:'welcome',u:base(),agreed:false,step:0,detail:null,course:null,filters:[]};localStorage.clear();render()}function render(){save();let h=state.screen==='welcome'?welcome():state.screen==='legal'?legal():state.screen==='register'?register():state.screen==='profile'?profile():state.screen==='voice'?voice():state.screen==='loading'?loading():state.screen==='results'?resultsScreen():state.screen==='filter'?filterScreen():state.screen==='admin'?admin():welcome();document.getElementById('app').innerHTML=h+'<div class="footer">InWork — Beta تجريبية · البيانات Mock محليًا</div>'+(state.detail?detailModal():'')+(state.course!==null?courseModal():'')+(state.toast?`<div class="modal" onclick="state.toast='';render()"><div class="sheet"><b>معلومة</b><p class="meta">${esc(state.toast)}</p><button class="btn" onclick="state.toast='';render()">تمام</button></div></div>`:'')}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
